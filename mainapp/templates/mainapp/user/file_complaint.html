{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File a Complaint</title>
  <link rel="stylesheet" href="{% static 'mainapp/styles.css' %}">
</head>
<body>

<section class="complaint-file">
    <h2>File a Complaint</h2>

    <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
        {% csrf_token %}

        <!-- Manual fields (linked with Django ModelForm by 'name' attributes) -->
        <label for="id_name">Full Name:</label>
        <input type="text" id="id_name" name="name" placeholder="Enter your full name" value="{{ form.name.value|default_if_none:'' }}">

        <label for="id_email">Email Address:</label>
        <input type="email" id="id_email" name="email" placeholder="Enter your email" value="{{ form.email.value|default_if_none:'' }}">

        <label for="id_phone">Phone Number:</label>
        <input type="tel" id="id_phone" name="phone" placeholder="Enter your phone number" value="{{ form.phone.value|default_if_none:'' }}">

        <label for="id_complaint">Complaint Details:</label>
        <textarea id="id_complaint" name="complaint_text" rows="5" placeholder="Describe your complaint...">
        </textarea>


        <button type="submit" class="btn-green">Submit Complaint</button>
    </form>
</section>

<footer>
    &copy; 2025 Online Complaint Portal | All Rights Reserved
</footer>

<script>
function validateForm() {
    var name = document.getElementById("id_name").value.trim();
    var email = document.getElementById("id_email").value.trim();
    var phone = document.getElementById("id_phone").value.trim();
    var complaint = document.getElementById("id_complaint").value.trim();

    var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (name === "") { alert("Please enter your full name."); return false; }
    if (email === "" || !email.match(emailPattern)) { alert("Please enter a valid email address."); return false; }
    if (phone.length !== 10) { alert("Phone number must be 10 digits"); return false; }
    if (complaint === "") { alert("Please describe your complaint."); return false; }

    alert("Complaint submitted successfully!");
    return true;
}
</script>

</body>
</html>
